[project]
name = "pills-monorepo"
version = "0.1.0"
description = "Pills Multi-Agent AI Teammate Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/forge",
]

[tool.pyright]
extraPaths = [
    "apps/api/src",
    "packages/forge/src",
]
venvPath = "."
venv = ".venv"
